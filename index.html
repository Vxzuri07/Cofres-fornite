<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17172b"><link rel="manifest" href="manifest.json"><title>Mi contador</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px 14px;background:#10101d;color:white;font-family:Arial,sans-serif}header,main,.voice{max-width:620px;margin:0 auto 15px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px}.card,.voice{background:#20203a;border:1px solid #393957;border-radius:18px;padding:15px;margin-bottom:12px}.voice button,.primary{background:#806ff0;color:white}.voice button,button{border:0;border-radius:12px;padding:12px;color:white;background:#41415e;font-weight:bold}button{cursor:pointer}.status,.hint{font-size:13px;color:#d0cfea;margin-top:9px}.name{font-size:19px;font-weight:bold}.num{text-align:center;font-size:48px;margin:15px}.actions{display:flex;gap:8px}.actions button{flex:1;font-size:22px}.plus{background:#6556cb}.small{font-size:12px;margin-top:10px}.goal{text-align:center;color:#bbb;margin-bottom:12px}input{width:100%;padding:12px;margin:5px 0 10px;border-radius:10px;border:1px solid #555;background:#15152a;color:white}
</style></head><body>
<header><h1>✨ Mi contador</h1><button class="primary" onclick="add()">＋ Nuevo</button></header>
<section class="voice"><button id="voiceBtn" onclick="voice()">🎙️ Activar comando de voz</button><div class="status" id="status">Pulsa y di una instrucción.</div><div class="hint">Ejemplos: “sumar uno a cofres”, “restar dos a cofres”, “reiniciar cofres”.</div></section>
<main id="list"></main>
<script>
const KEY='miContador_v1';let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){data=[]}
const $=x=>document.getElementById(x);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function say(t){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(t);u.lang='es-MX';speechSynthesis.speak(u)}}
function draw(){$('list').innerHTML=data.length?data.map((c,i)=>`<section class="card"><div class="name">${c.emoji||'🎁'} ${esc(c.name)}</div><div class="num">${c.value}</div><div class="goal">Meta: ${c.goal}</div><div class="actions"><button onclick="change(${i},-1)">−</button><button class="plus" onclick="change(${i},1)">＋</button><button onclick="reset(${i})">Reiniciar</button></div><div class="small"><button onclick="edit(${i})">Editar</button> <button onclick="del(${i})">Eliminar</button></div></section>`).join(''):'<section class="card">Todavía no tienes contadores. Pulsa ＋ Nuevo.</section>'}
function esc(s){return String(s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}
function add(){let n=prompt('Nombre del contador:');if(!n)return;let g=Number(prompt('Meta:',10))||10;let e=prompt('Emoji:', '🎁')||'🎁';data.push({name:n,goal:g,emoji:e,value:0,goalReached:false});save();draw()}
function edit(i){let n=prompt('Nombre:',data[i].name);if(n)data[i].name=n;let g=Number(prompt('Meta:',data[i].goal));if(g>0)data[i].goal=g;save();draw()}
function del(i){if(confirm('¿Eliminar este contador?')){data.splice(i,1);save();draw()}}
function reset(i){if(confirm('¿Reiniciar?')){data[i].value=0;data[i].goalReached=false;save();draw()}}
function change(i,d){let c=data[i];c.value=Math.max(0,c.value+d);goal(c);save();draw()}
function goal(c){if(c.value>=c.goal&&!c.goalReached){c.goalReached=true;say('¡Felicidades! Llegaste a la meta de '+c.name)}if(c.value<c.goal)c.goalReached=false}
function num(s){let m={uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,cero:0};return m[s]??(parseInt(s)||1)}
function command(raw){let t=raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();let m=t.match(/^(?:sumar|agregar|agrega)\s+(\w+)\s+a\s+(.+)$/);let a='sum';if(!m){m=t.match(/^(?:restar|quita|quitar)\s+(\w+)\s+a\s+(.+)$/);a='minus'}if(!m){m=t.match(/^(?:reiniciar|reinicia)\s+(.+)$/);a='reset'}if(!m){$('status').textContent='No entendí. Prueba “sumar uno a cofres”.';return}let amount=a==='reset'?0:num(m[1]);let target=(a==='reset'?m[1]:m[2]).replace(/^(el|la|los|las) /,'').trim();let c=data.find(x=>x.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')===target);if(!c){$('status').textContent='No encontré el contador '+target+'.';return}if(a==='sum')c.value+=amount;else if(a==='minus')c.value=Math.max(0,c.value-amount);else{c.value=0;c.goalReached=false}goal(c);save();draw();$('status').textContent='Listo: '+c.name}
function voice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('status').textContent='Este navegador no admite comandos de voz. Usa Safari actualizado o los botones.';return}let r=new SR();r.lang='es-MX';r.continuous=false;r.interimResults=false;$('status').textContent='Escuchando… di tu comando.';$('voiceBtn').textContent='🔴 Escuchando…';r.onresult=e=>command(e.results[0][0].transcript);r.onerror=e=>$('status').textContent='No se pudo usar el micrófono. Revisa el permiso y vuelve a intentar.';r.onend=()=> $('voiceBtn').textContent='🎙️ Activar comando de voz';try{r.start()}catch(e){$('status').textContent='No pude iniciar el micrófono.'}}
draw();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
